services:
  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma/db

  app:
    build: ./app
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

volumes:
  chroma_data:
